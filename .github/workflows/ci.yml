name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test CLI (offline commands)
        run: |
          node dist/cli.js actions show 254 | head -3
          node dist/cli.js trigger-types search "three finger" | head -1

  publish:
    # Publishes on version tags (v1.2.3) via npm Trusted Publishing (OIDC) - no NPM_TOKEN needed.
    # One-time setup on npmjs.com: package bettertouchtool -> Settings -> Trusted Publisher ->
    # GitHub Actions: owner folivoraAI, repo bettertouchtool-js, workflow ci.yml.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
