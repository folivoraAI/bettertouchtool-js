name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test CLI (offline commands)
        run: |
          node dist/cli.js actions show 254 | head -3
          node dist/cli.js trigger-types search "three finger" | head -1

  publish:
    # Publishes on version tags (v1.2.3) via npm Trusted Publishing (OIDC) - no NPM_TOKEN needed.
    # One-time setup on npmjs.com: package bettertouchtool -> Settings -> Trusted Publisher ->
    # GitHub Actions: owner folivoraAI, repo bettertouchtool-js, workflow ci.yml.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # NO registry-url here: setup-node would write an .npmrc with an (empty) _authToken and
          # always-auth, which makes npm skip the OIDC token exchange -> E404 on publish.
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm --version
      - run: npm ci
      - run: npm run build
      - name: Publish (prereleases get the "next" dist-tag, stable releases "latest")
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          npm publish --provenance --access public --tag "$TAG"
